services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: madebytoietmoi:latest
    container_name: madebytoietmoi
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Add your runtime env vars here, e.g.:
      # VITE_API_URL: https://api.example.com
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Optional: Nginx reverse proxy ─────────────────────────────────────────
  # Uncomment if you want TLS termination / gzip / caching in front of the app.
